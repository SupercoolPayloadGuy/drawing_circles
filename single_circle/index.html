<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Flower</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:monospace}
body{display:flex;flex-direction:column;background:#0a0a0a;color:#ccc}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
#canvas-wrap canvas{display:block;width:100%;height:100%}
#intro{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#intro>*{pointer-events:auto}
.intro-title{font-size:42px;font-weight:bold;color:#d7d7d7;letter-spacing:3px;margin-bottom:8px}
.intro-pts{font-size:14px;color:#8c8c8c;margin-bottom:16px}
.intro-count{font-size:72px;font-weight:bold;margin-bottom:20px;color:#ffc832}
.intro-btn{width:44px;height:44px;border-radius:8px;background:#1e1e1e;border:1px solid #3c3c3c;color:#8c8c8c;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.intro-btn:hover{background:#2a2a2a;border-color:#ffc832;color:#ffc832}
.intro-row{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.intro-hint{font-size:14px;color:#5f5f5f;margin-top:8px}
#ui{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#1a1a1a;border-top:1px solid #333;flex-wrap:wrap;user-select:none}
#ui button{padding:5px 14px;font:12px monospace;background:#2a2a2a;color:#ccc;border:1px solid #555;border-radius:6px;cursor:pointer;transition:.15s}
#ui button:hover{background:#3a3a3a;color:#ffc832;border-color:#ffc832}
#ui button.prim{background:#ffc832;color:#111;border-color:#ffc832;font-weight:bold}
#ui button.prim:hover{background:#ffd966}
#ui .sep{width:1px;height:24px;background:#444}
#theme-btn{position:absolute;top:12px;right:12px;padding:5px 14px;font:12px monospace;background:#191919;color:#b4b4b4;border:1px solid #444;border-radius:6px;cursor:pointer;z-index:10;transition:.15s}
#theme-btn:hover{color:#ffc832;border-color:#ffc832}
#hud{position:absolute;top:56px;left:14px;font:13px monospace;color:#828282;line-height:1.8;pointer-events:none;z-index:5}
#complete-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.72);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;pointer-events:none}
#complete-overlay>*{pointer-events:auto}
.complete-title{font-size:22px;font-weight:bold;color:#ffc832;margin-bottom:20px;letter-spacing:2px}
.complete-actions{display:flex;gap:14px;margin-bottom:14px}
.complete-actions button{padding:10px 24px;font:14px monospace;font-weight:bold;background:#2a2a2a;color:#ccc;border:1px solid #666;border-radius:8px;cursor:pointer;transition:.15s}
.complete-actions button:hover{background:#3a3a3a;color:#ffc832;border-color:#ffc832}
#export-msg{font:14px monospace;color:#8c8;margin-top:12px}
#complete-overlay{display:none}
#settings-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.72);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;pointer-events:none}
#settings-overlay>*{pointer-events:auto}
.settings-panel{background:#121212;border:1px solid #3c3c3c;border-radius:10px;padding:20px 28px;width:420px;max-width:92%}
.settings-title{font-size:18px;font-weight:bold;color:#ffc832;text-align:center;margin-bottom:14px;letter-spacing:2px}
.settings-row{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid #222;min-height:36px}
.settings-row:last-child{border:none}
.settings-label{font-size:13px;color:#d7d7d7;flex:1}
.settings-control{display:flex;align-items:center;gap:8px}
.settings-control input[type=range]{width:100px;accent-color:#ffc832}
.settings-control .val{font-size:13px;color:#ffc832;min-width:44px;text-align:right}
.settings-toggle{position:relative;width:36px;height:20px;cursor:pointer}
.settings-toggle input{opacity:0;width:0;height:0}
.settings-toggle .slider{position:absolute;inset:0;background:#323232;border-radius:20px;transition:.2s}
.settings-toggle .slider::before{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;background:#888;border-radius:50%;transition:.2s}
.settings-toggle input:checked+.slider{background:#50dc78}
.settings-toggle input:checked+.slider::before{background:#fff;transform:translateX(16px)}
.settings-hint{font-size:11px;color:#464646;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="intro">
    <div class="intro-title">CIRCLE FLOWER</div>
    <div class="intro-pts">POINTS</div>
    <div class="intro-count" id="countDisplay">24</div>
    <div class="intro-row">
      <button class="intro-btn" id="btnDec">◀</button>
      <button class="intro-btn" id="btnInc">▶</button>
    </div>
    <div class="intro-hint" id="enterHint">[ENTER] to start  ·  [TAB] settings</div>
  </div>
  <button id="theme-btn">[B] DARK</button>
  <div id="hud"></div>
  <div id="complete-overlay">
    <div class="complete-title">✦ COMPLETE ✦</div>
    <div class="complete-actions">
      <button id="choice-menu">← MENU</button>
      <button id="choice-look">LOOK AROUND</button>
      <button id="choice-png">EXPORT PNG</button>
      <button id="choice-svg">EXPORT SVG</button>
    </div>
    <div id="export-msg"></div>
  </div>
  <div id="settings-overlay">
    <div class="settings-panel">
      <div class="settings-title">SETTINGS</div>
      <div class="settings-row">
        <span class="settings-label">color scheme</span>
        <div class="settings-control">
          <span style="color:#5f5f5f;cursor:pointer" id="s-scheme-prev">◀</span>
          <span class="val" id="s-scheme-val" style="min-width:60px">rainbow</span>
          <span style="color:#5f5f5f;cursor:pointer" id="s-scheme-next">▶</span>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">main radius</span>
        <div class="settings-control">
          <input type="range" id="s-radius" min="80" max="500" value="350" step="10">
          <span class="val" id="s-radius-val">350px</span>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">speed</span>
        <div class="settings-control">
          <input type="range" id="s-speed" min="0.25" max="8" value="1" step="0.25">
          <span class="val" id="s-speed-val">1.00x</span>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">show circle count</span>
        <div class="settings-control">
          <label class="settings-toggle">
            <input type="checkbox" id="s-show-cc" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">show progress bar</span>
        <div class="settings-control">
          <label class="settings-toggle">
            <input type="checkbox" id="s-show-pb" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="settings-hint">[TAB] or [ENTER] back  ·  arrows to adjust</div>
    </div>
  </div>
</div>
<div id="ui">
  <button id="start-btn" class="prim">▶ START</button>
  <button id="pause-btn" style="display:none">▐▐ PAUSE</button>
  <button id="restart-btn" style="display:none">↺ RESTART</button>
  <button id="menu-btn" style="display:none">← MENU</button>
  <div class="sep"></div>
  <button id="settings-btn">⚙ SETTINGS</button>
  <span style="font:11px monospace;color:#555;margin-left:auto">scroll to zoom · drag to pan</span>
</div>

<script>
const HALF_PI = Math.PI / 2;
const TAU = 2 * Math.PI;
const COLOR_SCHEMES = ["rainbow","warm","cool","mono","sunset"];
const SCHEME_FNS = {
  rainbow: h => hsl(h, 1, 0.5),
  warm:    h => hsl(h * 0.15, 0.9, 0.5),
  cool:    h => hsl(0.5 + h * 0.3, 0.9, 0.5),
  mono:    () => [199,199,199],
  sunset:  h => hsl(h * 0.12, 0.8 + 0.2 * h, 0.5 + 0.1 * h),
};

function hsl(h, s, l) {
  s = Math.min(1, s); l = Math.min(1, l);
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h * 6) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 1/6) { r = c; g = x; b = 0; }
  else if (h < 2/6) { r = x; g = c; b = 0; }
  else if (h < 3/6) { r = 0; g = c; b = x; }
  else if (h < 4/6) { r = 0; g = x; b = c; }
  else if (h < 5/6) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}

function getColor(idx, total, scheme) {
  const fn = SCHEME_FNS[scheme] || SCHEME_FNS.rainbow;
  return fn(idx / Math.max(total, 1));
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');
let W, H, cx, cy;

let _cacheCanvas = null;
let _cacheCtx = null;
let _cacheCount = 0;

function _invalidateCache() { _cacheCanvas = null; }

function _syncCache() {
  const dpr = window.devicePixelRatio || 1;
  if (!_cacheCanvas || _cacheCanvas.width !== canvas.width || _cacheCanvas.height !== canvas.height) {
    const dpr = window.devicePixelRatio || 1;
    _cacheCanvas = document.createElement('canvas');
    _cacheCanvas.width = canvas.width;
    _cacheCanvas.height = canvas.height;
    _cacheCtx = _cacheCanvas.getContext('2d');
    _cacheCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    _cacheCount = 0;
  }

  if (_cacheCount < state.finishedCircles.length) {
    const newCircles = state.finishedCircles.slice(_cacheCount);
    const total = state.circles.length;
    for (const c of newCircles) {
      const col = getColor(c.idx, total, state.scheme);
      _cacheCtx.beginPath();
      _cacheCtx.arc(c.center[0], c.center[1], c.radius, 0, TAU);
      _cacheCtx.strokeStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
      _cacheCtx.lineWidth = 2;
      _cacheCtx.stroke();
    }
    _cacheCtx.lineWidth = 1;
    _cacheCount = state.finishedCircles.length;
  }
}

function resize() {
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = rect.width; H = rect.height;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  _invalidateCache();
}
window.addEventListener('resize', resize);

const state = {
  pointCount: 24, mainRadius: 350, speed: 1.0, scheme: "rainbow",
  showCC: true, showPB: true, dark: true,
  running: false, paused: false, done: false, lookMode: false,
  stage: -1,
  mainProg: 0, points: [], circles: [],
  visiblePoints: 0, pointTimer: 0,
  curCircle: 0, curProg: 0, finishedCircles: [],
};

function midpoint(a, b) { return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }
function dist(a, b) { return Math.hypot(a[0]-b[0], a[1]-b[1]); }
function circleFromPoints(a, b) {
  return { center: midpoint(a, b), radius: dist(a, b) / 2 };
}

function build() {
  const n = state.pointCount;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = -HALF_PI + TAU * i / n;
    pts.push([cx + state.mainRadius * Math.cos(a), cy + state.mainRadius * Math.sin(a)]);
  }
  state.points = pts;
  state.circles = pts.map(p => circleFromPoints([cx, cy], p));
}

function getBG() { return state.dark ? '#0a0a0a' : '#f5f0eb'; }

const bgAnim = {
  t0: 0, frameId: null,
  start() {
    this.t0 = performance.now();
    if (this.frameId) return;
    const tick = t => this.tick(t);
    this.frameId = requestAnimationFrame(tick);
  },
  stop() {
    if (this.frameId) { cancelAnimationFrame(this.frameId); this.frameId = null; }
  },
  tick(now) {
    if (!state.running && !state.done && !state.lookMode) this.draw((now - this.t0) / 1000);
    if (!state.running && !state.done && !state.lookMode) {
      this.frameId = requestAnimationFrame(t => this.tick(t));
    } else {
      this.frameId = null;
    }
  },
  draw(t) {
    ctx.fillStyle = getBG(); ctx.fillRect(0, 0, W, H);
    const r = 180 + 15 * Math.sin(t * 0.6);
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(cx, cy, r * (1 - i * 0.15), 0, TAU);
      ctx.strokeStyle = state.dark ? 'rgba(40,40,40,0.9)' : 'rgba(200,200,200,0.5)'; ctx.stroke();
    }
    const n = state.pointCount;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = -HALF_PI + TAU * i / n;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    for (const [px, py] of pts) {
      const mx = (cx + px) / 2, my = (cy + py) / 2, mr = Math.hypot(px - cx, py - cy) / 2;
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU);
      ctx.strokeStyle = state.dark ? 'rgba(65,65,65,0.7)' : 'rgba(180,180,180,0.5)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(px, py, 4, 0, TAU);
      ctx.fillStyle = '#ffc832'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, TAU);
    ctx.fillStyle = '#ffc832'; ctx.fill();
    const phase = (t % 3) / 3;
    const waveR = r * (1 + phase * 2);
    ctx.beginPath(); ctx.arc(cx, cy, waveR, 0, TAU);
    ctx.strokeStyle = `rgba(255,220,50,${Math.round((1 - phase) * 40)})`; ctx.stroke();
  },
};

function drawCircle(center, radius, color) {
  ctx.beginPath(); ctx.arc(center[0], center[1], Math.max(radius, 0), 0, TAU);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
}

function drawArc(center, radius, sweep, color) {
  if (sweep <= 0) return;
  ctx.beginPath(); ctx.arc(center[0], center[1], Math.max(radius, 0), 0, TAU * sweep);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
}

function drawDot(pt, color, rad) {
  ctx.beginPath(); ctx.arc(pt[0], pt[1], rad || 5, 0, TAU);
  ctx.fillStyle = color; ctx.fill();
}

function render() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = getBG(); ctx.fillRect(0, 0, W, H);

  _syncCache();
  ctx.drawImage(_cacheCanvas, 0, 0);

  const total = state.circles.length;
  if (state.stage === 2 && state.curCircle < state.circles.length) {
    const c = state.circles[state.curCircle];
    const col = getColor(state.curCircle, total, state.scheme);
    drawArc(c.center, c.radius, state.curProg / 360, `rgb(${col[0]},${col[1]},${col[2]})`);
  }
  if (state.stage >= 0) {
    drawArc([cx, cy], state.mainRadius, Math.min(1, state.mainProg / 360), '#fff');
  }
  if (state.stage >= 1) {
    for (let i = 0; i < state.visiblePoints; i++) {
      drawDot(state.points[i], '#fff', 5);
    }
  }
  if (state.stage >= 0) drawDot([cx, cy], '#ffc832', 6);
  const lines = [];
  if (state.showCC) {
    const extra = (state.stage === 2 && state.curCircle < state.circles.length) ? 1 : 0;
    lines.push(`circles  ${state.finishedCircles.length + extra} / ${total}`);
  }
  if (state.showPB) {
    let pct = 0;
    if (state.stage === 0) pct = state.mainProg / 360 * 5;
    else if (state.stage === 1) pct = 5 + state.visiblePoints / Math.max(state.points.length, 1) * 10;
    else if (state.stage === 2) pct = 15 + state.curCircle / Math.max(total, 1) * 85;
    else if (state.stage === 3) pct = 100;
    lines.push(`progress  ${pct.toFixed(1)}%`);
  }
  lines.push('speed  ' + state.speed.toFixed(2) + 'x');
  document.getElementById('hud').textContent = lines.join('\n');
}

let animFrameId = null;
let lastTime = 0;

function startAnimation() {
  state.running = true; state.paused = false; state.done = false; state.lookMode = false;
  state.stage = 0; state.mainProg = 0; state.visiblePoints = 0;
  state.pointTimer = 0; state.curCircle = 0; state.curProg = 0;
  state.finishedCircles = [];
  build();
  document.getElementById('intro').style.display = 'none';
  document.getElementById('start-btn').textContent = '■ STOP';
  document.getElementById('start-btn').classList.remove('prim');
  document.getElementById('pause-btn').style.display = '';
  document.getElementById('pause-btn').textContent = '▐▐ PAUSE';
  document.getElementById('restart-btn').style.display = 'none';
  document.getElementById('menu-btn').style.display = 'none';
  document.getElementById('complete-overlay').style.display = 'none';
  bgAnim.stop();
  lastTime = performance.now();
  animFrameId = requestAnimationFrame(tick);
}

function tick(now) {
  if (!state.running) return;
  if (state.paused) {
    lastTime = now;
    animFrameId = requestAnimationFrame(tick);
    render();
    return;
  }
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const speed = state.speed;
  if (state.stage === 0) {
    state.mainProg += 240 * speed * dt;
    if (state.mainProg >= 360) { state.mainProg = 360; state.stage = 1; }
  } else if (state.stage === 1) {
    state.pointTimer += dt;
    if (state.pointTimer >= 0.02 / speed) {
      state.pointTimer = 0;
      state.visiblePoints = Math.min(state.visiblePoints + 1, state.points.length);
      if (state.visiblePoints >= state.points.length) state.stage = 2;
    }
  } else if (state.stage === 2) {
    if (state.curCircle < state.circles.length) {
      state.curProg += 240 * speed * dt;
      if (state.curProg >= 360) {
        state.finishedCircles.push({ ...state.circles[state.curCircle], idx: state.curCircle });
        state.curCircle++;
        state.curProg = 0;
      }
    } else {
      state.stage = 3; state.done = true; state.running = false;
      finish(); return;
    }
  }
  render();
  animFrameId = requestAnimationFrame(tick);
}

function finish() {
  document.getElementById('start-btn').textContent = '↺ RESTART';
  document.getElementById('start-btn').classList.add('prim');
  document.getElementById('pause-btn').style.display = 'none';
  document.getElementById('restart-btn').style.display = '';
  document.getElementById('menu-btn').style.display = '';
  document.getElementById('complete-overlay').style.display = 'flex';
  document.getElementById('export-msg').textContent = '';
}

function stopAnimation() {
  state.running = false; state.done = false; state.paused = false;
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  document.getElementById('start-btn').textContent = '▶ START';
  document.getElementById('start-btn').classList.add('prim');
  document.getElementById('pause-btn').style.display = 'none';
  document.getElementById('restart-btn').style.display = 'none';
  document.getElementById('menu-btn').style.display = 'none';
  document.getElementById('complete-overlay').style.display = 'none';
  document.getElementById('intro').style.display = '';
  bgAnim.start();
}

function exitLook() {
  state.lookMode = false;
  document.getElementById('menu-btn').style.display = state.done ? '' : 'none';
  if (state.done) document.getElementById('complete-overlay').style.display = 'flex';
  else stopAnimation();
}

function rgbHex(r, g, b) { return '#' + [r, g, b].map(c => Math.round(c).toString(16).padStart(2, '0')).join(''); }

function exportPNG() {
  render();
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'circle_flower.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showMsg('PNG saved ✓');
  });
}

function exportSVG() {
  const { points, circles, finishedCircles, mainRadius, scheme } = state;
  const total = circles.length;
  const lines = [
    '<?xml version="1.0" encoding="UTF-8"?>',
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`,
    `<rect width="${W}" height="${H}" fill="${getBG()}"/>`,
    `<clipPath id="m"><circle cx="${cx}" cy="${cy}" r="${mainRadius}"/></clipPath>`,
    `<g clip-path="url(#m)">`,
  ];
  for (const c of finishedCircles) {
    const col = getColor(c.idx, total, state.scheme);
    const hex = rgbHex(col[0], col[1], col[2]);
    lines.push(`  <circle cx="${c.center[0]}" cy="${c.center[1]}" r="${c.radius}" fill="none" stroke="${hex}" stroke-width="2"/>`);
  }
  lines.push('</g>');
  lines.push(`<circle cx="${cx}" cy="${cy}" r="${mainRadius}" fill="none" stroke="#fff" stroke-width="3"/>`);
  lines.push(`<circle cx="${cx}" cy="${cy}" r="6" fill="#ffc832"/>`);
  for (const p of points) lines.push(`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff"/>`);
  lines.push('</svg>');
  const blob = new Blob([lines.join('\n')], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'circle_flower.svg';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showMsg('SVG saved ✓');
}

function showMsg(m) {
  const el = document.getElementById('export-msg');
  el.textContent = m; setTimeout(() => el.textContent = '', 2000);
}

// Look mode
let lookPanX = 0, lookPanY = 0, lookZoom = 1, lookDragging = false, lookDragStart = null;

function enterLook() {
  state.lookMode = true;
  document.getElementById('complete-overlay').style.display = 'none';
  document.getElementById('menu-btn').style.display = '';
  lookPanX = 0; lookPanY = 0; lookZoom = 1;
  renderLook();
}

function renderLook() {
  ctx.fillStyle = getBG(); ctx.fillRect(0, 0, W, H);
  const total = state.circles.length;
  ctx.save();
  ctx.translate(lookPanX, lookPanY);
  ctx.scale(lookZoom, lookZoom);
  for (const c of state.finishedCircles) {
    const col = getColor(c.idx, total, state.scheme);
    ctx.beginPath(); ctx.arc(c.center[0], c.center[1], c.radius, 0, TAU);
    ctx.strokeStyle = `rgb(${col[0]},${col[1]},${col[2]})`; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, state.mainRadius, 0, TAU);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, TAU);
  ctx.fillStyle = '#ffc832'; ctx.fill();
  for (const p of state.points) {
    ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, TAU);
    ctx.fillStyle = '#fff'; ctx.fill();
  }
  ctx.restore();
  // hint
  ctx.fillStyle = state.dark ? '#888' : '#aaa';
  ctx.font = '14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('drag to pan  ·  scroll to zoom  ·  ESC to exit', W / 2, 28);
}

// UI controls
document.getElementById('btnDec').addEventListener('click', () => {
  state.pointCount = Math.max(2, state.pointCount - 1);
  document.getElementById('countDisplay').textContent = state.pointCount;
});
document.getElementById('btnInc').addEventListener('click', () => {
  state.pointCount = Math.min(100, state.pointCount + 1);
  document.getElementById('countDisplay').textContent = state.pointCount;
});
document.getElementById('start-btn').addEventListener('click', () => {
  if (state.running) { stopAnimation(); return; }
  if (state.done) { stopAnimation(); return; }
  startAnimation();
});
document.getElementById('pause-btn').addEventListener('click', () => {
  state.paused = !state.paused;
  document.getElementById('pause-btn').textContent = state.paused ? '▶ PLAY' : '▐▐ PAUSE';
});
document.getElementById('restart-btn').addEventListener('click', stopAnimation);
document.getElementById('menu-btn').addEventListener('click', () => {
  if (state.lookMode) { exitLook(); return; }
  stopAnimation();
});
document.getElementById('choice-menu').addEventListener('click', stopAnimation);
document.getElementById('choice-look').addEventListener('click', enterLook);
document.getElementById('choice-png').addEventListener('click', exportPNG);
document.getElementById('choice-svg').addEventListener('click', exportSVG);

document.getElementById('theme-btn').addEventListener('click', () => {
  state.dark = !state.dark;
  document.getElementById('theme-btn').textContent = state.dark ? '[B] DARK' : '[B] LIGHT';
  document.body.style.background = state.dark ? '#0a0a0a' : '#f5f0eb';
  _invalidateCache();
  if (state.lookMode) renderLook();
  else if (state.done || state.running) render();
  else { ctx.fillStyle = getBG(); ctx.fillRect(0, 0, W, H); }
});

// Settings
const settingsOverlay = document.getElementById('settings-overlay');
document.getElementById('settings-btn').addEventListener('click', () => { settingsOverlay.style.display = 'flex'; });
settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) settingsOverlay.style.display = 'none'; });

const sSchemeVal = document.getElementById('s-scheme-val');
document.getElementById('s-scheme-prev').addEventListener('click', () => {
  const i = (COLOR_SCHEMES.indexOf(state.scheme) - 1 + COLOR_SCHEMES.length) % COLOR_SCHEMES.length;
  state.scheme = COLOR_SCHEMES[i]; sSchemeVal.textContent = state.scheme;
  _invalidateCache(); render();
});
document.getElementById('s-scheme-next').addEventListener('click', () => {
  const i = (COLOR_SCHEMES.indexOf(state.scheme) + 1) % COLOR_SCHEMES.length;
  state.scheme = COLOR_SCHEMES[i]; sSchemeVal.textContent = state.scheme;
  _invalidateCache(); render();
});
const sRadius = document.getElementById('s-radius');
const sRadiusVal = document.getElementById('s-radius-val');
sRadius.addEventListener('input', () => { state.mainRadius = +sRadius.value; sRadiusVal.textContent = state.mainRadius + 'px'; });
const sSpeed = document.getElementById('s-speed');
const sSpeedVal = document.getElementById('s-speed-val');
sSpeed.addEventListener('input', () => { state.speed = +sSpeed.value; sSpeedVal.textContent = state.speed.toFixed(2) + 'x'; });
document.getElementById('s-show-cc').addEventListener('change', function() { state.showCC = this.checked; });
document.getElementById('s-show-pb').addEventListener('change', function() { state.showPB = this.checked; });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'b' || e.key === 'B') { document.getElementById('theme-btn').click(); return; }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (settingsOverlay.style.display === 'flex') settingsOverlay.style.display = 'none';
    else if (!state.running && !state.done) settingsOverlay.style.display = 'flex';
    return;
  }
  if (e.key === 'Escape') {
    if (state.lookMode) { exitLook(); return; }
    if (state.done || state.running) { stopAnimation(); return; }
  }
  if (e.key === 'p' || e.key === 'P') {
    if (state.running) { document.getElementById('pause-btn').click(); return; }
  }
  if (e.key === '[' && state.running) {
    state.speed = Math.max(0.25, Math.round((state.speed - 0.25) * 100) / 100);
  }
  if (e.key === ']' && state.running) {
    state.speed = Math.min(8.0, Math.round((state.speed + 0.25) * 100) / 100);
  }
  if (e.key === 'Enter' && !state.running && !state.done) { startAnimation(); return; }
  if (!state.running && !state.done) {
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      state.pointCount = Math.min(100, state.pointCount + 1);
      document.getElementById('countDisplay').textContent = state.pointCount;
    }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      state.pointCount = Math.max(2, state.pointCount - 1);
      document.getElementById('countDisplay').textContent = state.pointCount;
    }
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (state.lookMode) {
    lookZoom = Math.max(0.1, Math.min(10, lookZoom * (e.deltaY < 0 ? 1.1 : 0.9)));
    renderLook();
  } else if (state.running || state.done) {
    // no zoom in normal mode unless look
  }
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0 || !state.lookMode) return;
  lookDragging = true;
  lookDragStart = { x: e.clientX, y: e.clientY, px: lookPanX, py: lookPanY };
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!lookDragging || !state.lookMode) return;
  lookPanX = lookDragStart.px + e.clientX - lookDragStart.x;
  lookPanY = lookDragStart.py + e.clientY - lookDragStart.y;
  renderLook();
});
window.addEventListener('mouseup', () => {
  if (lookDragging) { lookDragging = false; canvas.style.cursor = ''; }
});

resize();
bgAnim.start();
</script>
</body>
</html>
